name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast, infrastructure-free gates: they run anywhere and always.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Pylint
        run: PYTHONPATH=src python -m pylint src/vmdeploy tests

      - name: mypy
        run: PYTHONPATH=src python -m mypy

      - name: Pytest (unit tier)
        run: PYTHONPATH=src python -m pytest -m "not e2e"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Go vet and test
        working-directory: goservice
        run: |
          go vet ./...
          go test ./...

  # End-to-end against the container stack. GitHub runners have Docker, so this
  # exercises the real load balancer, backends, and inventory service. It is the same
  # suite the VirtualBox path runs, pointed at the compose stack.
  compose-e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build and start the container stack
        run: docker compose up --build -d

      - name: Wait for the cluster to be ready
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5090/healthz >/dev/null \
               && curl -fsS http://localhost/ >/dev/null; then
              echo "cluster is up"; exit 0
            fi
            sleep 2
          done
          echo "cluster did not become ready"; docker compose logs; exit 1

      - name: Point the config at the compose stack
        run: |
          cat > config/cluster.local.toml <<'EOF'
          [ssh]
          user = "ci"
          key_path = "/tmp/nokey"
          [virtualbox]
          vboxmanage = "/usr/bin/VBoxManage"
          [inventory]
          key_file = "./.compose-data/inventory.key"
          manifest_file = "./.compose-data/inventory.enc"
          EOF

      - name: E2E suite against the container stack
        run: |
          PYTHONPATH=src python -m pytest --require-cluster \
            --balancer-url http://localhost \
            --inventory-url http://localhost:5090 \
            --alluredir=allure-results

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

  # The publish/pull scripts move the golden OVA through an OCI registry so the
  # image never has to be shared privately. They were documented but had never
  # been executed, which is how a wrong default path survived in them. This job
  # runs the real scripts end to end against GHCR using a small stand-in
  # appliance, so the round trip is exercised on every push. It needs neither
  # VirtualBox nor a Docker daemon, so it is unaffected by the Hyper-V/VirtualBox
  # conflict that stops the container path running on a VirtualBox host.
  publish-roundtrip:
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install ORAS
        env:
          ORAS_VERSION: "1.2.0"
        run: |
          curl -fsSL \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          oras version

      # Only the hypervisor path needs overriding; template_ova is deliberately
      # left to the committed default so this job proves that default resolves.
      - name: Point the config at this runner
        run: |
          cat > config/cluster.local.toml <<'EOF'
          [ssh]
          user = "ci"
          key_path = "/tmp/nokey"
          [virtualbox]
          vboxmanage = "/usr/bin/VBoxManage"
          EOF

      - name: Stand in a small appliance at the configured path
        run: |
          ova=$(python scripts/_resolve_template_ova.py config/cluster.toml | head -1)
          echo "resolved template_ova: $ova"
          mkdir -p "$(dirname "$ova")"
          head -c 1048576 /dev/urandom > "$ova"
          sha256sum "$ova" | awk '{print $1}' > /tmp/published.sha256

      - name: Publish and pull back through the real scripts
        env:
          ORAS_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A fixed tag, deliberately not ${{ github.sha }}: a per-commit tag
          # would leave a new package version behind on every push, and they
          # accumulate in the account's package list forever. Reusing one tag
          # keeps the test artifact to a single entry.
          ref="ghcr.io/${{ github.repository_owner }}/apcluster-golden-citest:citest"
          echo "$ref" > /tmp/citest-ref
          echo "$ORAS_PASS" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          # -Ref is passed explicitly so CI never pushes over the real published
          # image; the default would come from [virtualbox].template_image_ref.
          pwsh -File scripts/publish-image.ps1 -Ref "$ref"
          pwsh -File scripts/pull-image.ps1 -Ref "$ref" -DestDir /tmp/pulled
          sha256sum /tmp/pulled/apcluster-golden.ova | awk '{print $1}' > /tmp/pulled.sha256
          if diff -q /tmp/published.sha256 /tmp/pulled.sha256; then
            echo "round trip verified: pulled appliance is byte-identical to the published one"
          else
            echo "MISMATCH between published and pulled appliance"; exit 1
          fi

      # Deletes the throwaway artifact so it does not sit in the owner's public
      # package list beside the real image.
      #
      # This needs GHCR_CLEANUP_TOKEN: a PAT with `delete:packages`. GITHUB_TOKEN
      # cannot do it, because `packages: write` grants no delete right, confirmed by a
      # live run returning "denied". A repository secret is the right place for
      # this: it is encrypted, never downloadable as a repository file, and only
      # decrypts inside runs of this repo. That is a different thing from the
      # published image, which must carry no credentials because anyone can
      # download and open it.
      #
      # Non-fatal by design, and skipped cleanly when the secret is absent, so a
      # fork or a fresh clone still passes CI. Runs even when the round trip
      # failed, so a failure leaves nothing behind either.
      - name: Remove the CI test artifact
        if: always()
        continue-on-error: true
        env:
          CLEANUP_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
        run: |
          ref=$(cat /tmp/citest-ref 2>/dev/null) || exit 0
          package="${ref#*/*/}"; package="${package%%:*}"
          if [ -z "$CLEANUP_TOKEN" ]; then
            echo "GHCR_CLEANUP_TOKEN is not set, so '$package' is left in place."
            echo "The tag is reused rather than per-commit, so it does not accumulate."
            exit 0
          fi
          status=$(curl -sS -o /tmp/cleanup.out -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLEANUP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/$package")
          if [ "$status" = "204" ]; then
            echo "deleted the '$package' package"
          else
            echo "could not delete '$package' (HTTP $status):"
            cat /tmp/cleanup.out
          fi
