# Backend virtual host for the container stack. Mirrors the VM backend vhost:
# serves the static site on :8080 and stamps its identity into the
# X-Backend-Host response header, which the load balancing tests read.
#
# ${BACKEND_HOST} is supplied per container by docker-compose, so one image
# serves as apnode1, apnode2, or any number of additional backends.

ServerName ${BACKEND_HOST}
Listen 8080

LoadModule headers_module modules/mod_headers.so

<VirtualHost *:8080>
    DocumentRoot /usr/local/apache2/htdocs

    <Directory /usr/local/apache2/htdocs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Identity stamp consumed by the load balancing test suite.
    Header always set X-Backend-Host "${BACKEND_HOST}"
</VirtualHost>
