# Load balancer virtual host for the container stack. Mirrors the VM balancer
# vhost: byrequests scheduling with no sticky session, so consecutive requests
# from one client land on different backends and the distribution tests pass.
#
# Backend addresses are Docker service names, which the compose network resolves.

ServerName apjump

LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule headers_module modules/mod_headers.so

ProxyRequests Off
ProxyPreserveHost On

<Proxy "balancer://apcluster">
    BalancerMember "http://apnode1:8080" route=apnode1
    BalancerMember "http://apnode2:8080" route=apnode2
    ProxySet lbmethod=byrequests
</Proxy>

ProxyPass        "/balancer-manager" "!"
ProxyPass        "/" "balancer://apcluster/"
ProxyPassReverse "/" "balancer://apcluster/"

<Location "/balancer-manager">
    SetHandler balancer-manager
    Require all granted
</Location>
